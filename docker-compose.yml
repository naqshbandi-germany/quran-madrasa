services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quran_madrasa
    ports:
      - "5432:5432"
    volumes:
      - quran_madrasa_pgdata:/var/lib/postgresql/data

volumes:
  quran_madrasa_pgdata:
