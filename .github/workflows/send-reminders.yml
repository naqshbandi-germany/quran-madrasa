name: Send Class Reminders

# Den 15-Minuten-Takt uebernimmt cron-job.org (siehe README, Abschnitt Taktgeber). Dieser
# Workflow bleibt nur als manueller Notfall-Knopf (Actions -> Run workflow), da GitHub Actions
# bei privaten Repos nur begrenzte Freiminuten hat.
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X POST "https://www.islamunterfreunden.de/api/cron/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
